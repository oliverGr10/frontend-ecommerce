<div class="bg-gray-900 text-white min-h-screen">

  <header class="p-4 bg-gray-800 text-white">
    <nav class="flex flex-col md:flex-row justify-between items-center">
      <!-- Logo and Brand -->
      <div class="flex items-center mb-4 md:mb-0">
        <div class="text-2xl md:text-3xl text-red-500 hover:text-red-400 font-bold flex items-center">
            <i class="fas fa-shopping-cart text-white mr-2"></i> <!-- Ícono del carrito en blanco -->
            Add to Cart
        </div>
    </div>
  
      <!-- Navigation Links -->
      <ul class="flex flex-col md:flex-row space-y-2 md:space-y-0 md:space-x-6 text-base md:text-lg mb-4 md:mb-0">
        <li><a routerLink="/home" class="text-red-500 hover:text-red-400">Inicio</a></li>
        <li><a (click)="goToSection('about-home')" class="hover:text-gray-300">Sobre Nosotros</a></li>
        <li><a routerLink="/productos" class="hover:text-gray-300">Productos</a></li>
      </ul>
  
      <!-- Search Bar -->
      <div class="relative text-black w-full md:w-auto md:flex-grow md:mx-4 md:max-w-md mb-4 md:mb-0">
        <input
          type="text"
          placeholder="Buscar..."
          class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="absolute left-3 top-2.5 h-5 w-8 text-gray-500 cursor-pointer"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </div>
  
      <!-- Login and Cart -->
      <div class="flex items-center space-x-4">
        <a *ngIf="!isLoggedIn" (click)="openLoginDialog()" class="hover:text-gray-300 cursor-pointer">Iniciar Sesión</a>

  <!-- Mostrar iconos útiles tras autenticación -->
<div *ngIf="isLoggedIn" class="flex items-center space-x-4">
  <!-- Contenedor del perfil con menú desplegable -->
  <div class="relative">
    <button (click)="toggleDropdown()" class="hover:text-gray-300 focus:outline-none">
      <i class="fas fa-user text-2xl"></i>
    </button>

    <!-- Menú desplegable -->
    <div *ngIf="isDropdownOpen" 
         class="absolute right-0 mt-1 w-48 bg-gray-800 rounded-lg shadow-lg py-1 z-50 border border-gray-700">
      <button (click)="openAccountModal()" 
              class="w-full px-4 py-2 text-white hover:bg-gray-700 flex items-center space-x-2">
        <i class="fas fa-user-circle"></i>
        <span>Mi Cuenta</span>
      </button>
      <button (click)="logout()" 
              class="w-full px-4 py-2 text-white hover:bg-gray-700 flex items-center space-x-2">
        <i class="fas fa-sign-out-alt"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </div>

  <a (click)="openOrderDialog()" class="hover:text-gray-300">
    <i class="fas fa-box text-2xl"></i>
  </a>    
</div>
        <svg 
          (click)="openCartDialog()" 
          xmlns="http://www.w3.org/2000/svg" 
          class="h-8 w-8 cursor-pointer hover:text-gray-300" 
          fill="none" 
          viewBox="0 0 24 24" 
          stroke="currentColor">
          <path 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            stroke-width="2" 
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      </div>
    </nav>
  </header>

  <div *ngIf="isModalOpen" 
  class=" absolute right-0 mt-2 w-80 rounded-b-xl shadow-2xl z-50 overflow-hidden">
  
  <!-- Container del modal -->
  <div class=" w-full bg-white">
      <!-- Header -->
      <div class="px-6 py-4 bg-gradient-to-r from-red-500 to-red-600 ">
      <h2 class="text-left font-sans text-xl">Mis datos</h2>
      </div>

      <!-- Contenido -->
      <div class="p-5 space-y-4 bg-gray-50">
          <div class="space-y-3">
              <div class="group hover:bg-gray-100 transition-colors rounded-lg p-3">
                  <label class="text-sm text-gray-500 block mb-1">Nombre</label>
                  <div class="text-gray-800 font-medium">{{ user?.name }}</div>
              </div>
              
              <div class="group hover:bg-gray-100 transition-colors rounded-lg p-3">
                  <label class="text-sm text-gray-500 block mb-1">Apellidos</label>
                  <div class="text-gray-800 font-medium">{{ user?.lastName }}</div>
              </div>
              
              <div class="group hover:bg-gray-100 transition-colors rounded-lg p-3">
                  <label class="text-sm text-gray-500 block mb-1">Nombre de Usuario</label>
                  <div class="text-gray-800 font-medium">{{ user?.username }}</div>
              </div>
        
              
              <div class="group hover:bg-gray-100 transition-colors rounded-lg p-3">
                  <label class="text-sm text-gray-500 block mb-1">Documento</label>
                  <div class="text-gray-800 font-medium">
                      {{ user?.documentType }} - {{ user?.numDoc }}
                  </div>
              </div>
          </div>
      </div>

      <!-- Footer -->
      <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end space-x-3">
          <button (click)="logout()" 
                  class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg transition-colors flex items-center space-x-2 text-sm font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              <span>Cerrar sesión</span>
          </button>
          
          <button (click)="closeModal()" 
                  class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg transition-colors text-sm font-medium">
              Cerrar
          </button>
      </div>
  </div>
</div>






  <main class="container mx-auto px-4 py-8">
    <section>
      <app-carrousel-home></app-carrousel-home>
    </section>

    <!-- Sección de productos -->
    <section id="products-home" class="my-8">
      <app-product-home></app-product-home>
    </section>

    <section id="about-home" class="my-8">
      <app-about-home></app-about-home>
    </section>

    <section id="contact-home" class="mt-8">
      <app-footer-home></app-footer-home>
    </section>
  </main>
</div>
