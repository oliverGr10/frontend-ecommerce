<div class="relative group">
    <!-- Imagen en miniatura -->
    <img [src]="imageUrl || 'assets/placeholder.png'"
         [alt]="alt"
         class="h-10 w-10 rounded-md object-cover cursor-pointer transition-all duration-300
                hover:scale-110 hover:shadow-lg"
         (click)="toggleLightbox()">
    
    <!-- Preview en hover -->
    <div *ngIf="showPreview"
         class="absolute opacity-0 group-hover:opacity-100 transition-all duration-300
                pointer-events-none bg-white rounded-lg shadow-2xl"
         [ngStyle]="previewStyle">
      <img [src]="imageUrl || 'assets/placeholder.png'"
           [alt]="alt"
           class="w-48 h-48 rounded-lg object-cover">
    </div>
    
    <!-- Lightbox -->
    <div *ngIf="isLightboxOpen"
         class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-75"
         (click)="toggleLightbox()">
      <div class="relative max-w-4xl max-h-[90vh] p-2 bg-white rounded-lg">
        <img [src]="imageUrl || 'assets/placeholder.png'"
             [alt]="alt"
             class="max-w-full max-h-[calc(90vh-2rem)] object-contain">
        <button class="absolute top-2 right-2 text-gray-800 hover:text-gray-600"
                (click)="toggleLightbox()">
          <span class="text-2xl">&times;</span>
        </button>
      </div>
    </div>
  </div>
