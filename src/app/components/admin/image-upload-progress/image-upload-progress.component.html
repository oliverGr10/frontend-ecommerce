<div class="flex justify-center gap-6 my-4">
    <div *ngFor="let slot of [0, 1, 2]" 
         class="relative flex items-center justify-center w-16 h-16 rounded-full border-2 transition-all duration-300"
         [ngClass]="{
           'border-green-500 bg-green-50': slot < imageCount,
           'border-gray-300 bg-gray-50': slot >= imageCount
         }">
      <!-- Check icon cuando la imagen está cargada -->
      <svg *ngIf="slot < imageCount" 
           xmlns="http://www.w3.org/2000/svg" 
           class="w-8 h-8 text-green-500 animate-bounce" 
           fill="none" 
           viewBox="0 0 24 24" 
           stroke="currentColor">
        <path stroke-linecap="round" 
              stroke-linejoin="round" 
              stroke-width="3" 
              d="M5 13l4 4L19 7" />
      </svg>
      
      <!-- Image icon para slots vacíos -->
      <svg *ngIf="slot >= imageCount" 
           xmlns="http://www.w3.org/2000/svg" 
           class="w-8 h-8 text-gray-400" 
           fill="none" 
           viewBox="0 0 24 24" 
           stroke="currentColor">
        <path stroke-linecap="round" 
              stroke-linejoin="round" 
              stroke-width="1.5" 
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      
      <!-- Número de imagen -->
      <div class="absolute -bottom-6 text-sm text-gray-600">
        Imagen {{ slot + 1 }}
      </div>
    </div>
  </div>
